name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libasound2-dev libudev-dev


      - name: Build
        run: cargo build --verbose

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

